[unix_http_server]
file=/run/moviepilot/supervisor.sock
chmod=0770
chown=root:moviepilot
username=moviepilot
password=%(ENV_MOVIEPILOT_SUPERVISOR_PASSWORD)s

[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/run/moviepilot/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/moviepilot/supervisor.sock
username=moviepilot
password=%(ENV_MOVIEPILOT_SUPERVISOR_PASSWORD)s

[program:moviepilot-nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:moviepilot-backend]
command=/bin/bash %(ENV_MP_CONTROL_DIR)s/backend.sh
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:moviepilot-update-worker]
command=/bin/bash /usr/local/lib/moviepilot/control/update-worker.sh
directory=/app
priority=30
user=root
autostart=false
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=300
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
