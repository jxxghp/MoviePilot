# 宿主内部导入读取真实 .py/.pyi 合同；仅 files 中的目标在此严格检查。
# 未纳入清单的历史债务继续由完整 app 显式扫描逐文件、逐错误码守住低水位。
[mypy-app.*]
follow_imports = silent
follow_imports_for_stubs = True

# 读取已安装供应方的真实装饰器与路由签名，避免把已声明类型的接口视为 Any。
[mypy-click.*,fastapi.*]
follow_imports = silent
