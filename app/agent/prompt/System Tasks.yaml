version: 2
shared_rules:
  - This is a background system task, NOT a user conversation.
  - Your final response will be consumed by the system. Keep it concise and task-focused.
  - Do NOT include greetings, explanations, or conversational text.
  - Respond in Chinese (中文).
task_types:
  heartbeat:
    header: "[System Heartbeat]"
    objective: "Check all jobs in your jobs directory and process pending tasks."
    steps_title: "Follow these steps"
    steps:
      - "List all jobs with status 'pending' or 'in_progress'."
      - "For 'recurring' jobs, check 'last_run' to determine if it's time to run again."
      - "For 'once' jobs with status 'pending', execute them now."
      - "After executing each job, update its status, 'last_run' time, and execution log in the JOB.md file."
      - "If any job was executed, use the `send_message` tool to send a concise execution report to the user through configured notification channels."
    empty_result: "If no jobs were executed, output nothing."
    task_rules:
      - "After sending the execution report with `send_message`, do not repeat the report in your final response."
      - "Your final response for heartbeat must be empty; reporting is handled only through the `send_message` tool."
  health_check:
    header: "[System Health Check]"
    objective: "Verify that the agent execution pipeline is alive."
    steps_title: "Follow these steps"
    steps:
      - "Verify that runtime config, tools, and jobs can all be accessed normally."
      - "If a real issue is detected, report the failing subsystem and the immediate blocking reason."
    empty_result: "If there is nothing meaningful to report, output OK only."
  transfer_failed_retry:
    header: "[System Task - Transfer Failed Retry]"
    objective: "A file transfer or organization has failed. Please use the `transfer-failed-retry` skill to retry the failed transfer."
    context_title: "Task context"
    context_lines:
      - "Failed transfer history record IDs: {history_ids_csv}"
      - "Total failed records: {history_count}"
    steps_title: "Follow these steps"
    steps:
      - "Use `moviepilot_api` operation `transfer.history` with status='failed' to find the record with id={history_id} and understand the failure details such as source path, error message, and media info."
      - "Analyze the error message to determine the best retry strategy."
      - "If the source file no longer exists, skip this retry and report that the file is missing."
      - "Call `moviepilot_api` operation `transfer.history.delete` for history_id={history_id}. Durable records are not deleted: the API submits them to the persistent retry scheduler."
      - "If `transfer.history.delete` reports that a durable retry was accepted or rejected, stop and report the exact scheduler result. Do not call `transfer.file`; do not delete the target, history, or retry evidence."
      - "Only for a legacy history that was actually deleted, re-identify the media using `media.recognize` with the source file path. For audio files, set media_type='music' and preserve artist/title/album context."
      - "If legacy recognition fails, try `media.search` with keywords from the filename. For music, distinguish recording, album, and browse-only artist results."
      - "Re-transfer only the deleted legacy history using `transfer.file` with the source path and exact identity fields. Reuse media_source + media_id for every media type, plus media_type + music_type for music."
      - "Report the final result."
  batch_transfer_failed_retry:
    header: "[System Task - Batch Transfer Failed Retry]"
    objective: "Multiple file transfers have failed. Group only records that share a trustworthy movie, series, recording, or album identity, then use the `transfer-failed-retry` skill to retry them efficiently."
    context_title: "Task context"
    context_lines:
      - "Failed transfer history record IDs: {history_ids_csv}"
      - "Total failed records: {history_count}"
    steps_title: "Follow these steps"
    steps:
      - "Use `transfer.history` with status='failed' to find all records with these IDs and understand the failure details."
      - "Group records by exact media identity and source directory before retrying. Do not assume all selected files belong to one media."
      - "If the error is about media recognition, identify each group once using `media.recognize` or `media.search`, then reuse that result inside the group. Album tracks should normally be retried from the shared album directory with the album identity."
      - "For each failed record, call `transfer.history.delete`. Durable records are submitted to the persistent retry scheduler, and that result is final for this task: report its exact accepted or rejected state and do not call `transfer.file` or delete its evidence. Only an actually deleted legacy history may be re-transferred with `transfer.file`."
      - "Report how many retries succeeded and how many still failed."
    task_rules:
      - "Within one verified group, do NOT call `media.recognize` or `media.search` repeatedly for each file. A music recording is one track; a music album is one multi-track directory; an artist is never a transfer target."
  manual_transfer_redo:
    header: "[System Task - Manual Transfer Re-Organize]"
    objective: "A user manually triggered an AI re-organize task from the transfer history page."
    context_title: "Transfer history record"
    context_lines:
      - "- History ID: {history_id}"
      - "- Current status: {current_status}"
      - "- Current recognized title: {recognized_title}"
      - "- Media type: {media_type}"
      - "- Category: {category}"
      - "- Year: {year}"
      - "- Season/Episode: {season_episode}"
      - "- Source path: {source_path}"
      - "- Source storage: {source_storage}"
      - "- Destination path: {destination_path}"
      - "- Destination storage: {destination_storage}"
      - "- Transfer mode: {transfer_mode}"
      - "- Current media source: {media_source}"
      - "- Current source-native ID: {media_id}"
      - "- Music entity type: {music_type}"
      - "- Expected album tracks: {total_tracks}"
      - "- Error message: {error_message}"
    steps_title: "Required workflow"
    steps:
      - "Use `transfer.history` to locate and inspect the record with id={history_id}, and verify the source path, status, media info, and failure context."
      - "Decide whether the current recognition is trustworthy."
      - "If the source file no longer exists or cannot be safely processed, stop and report the reason."
      - "If the current recognition is wrong or the record should be reorganized, determine the correct media identity first."
      - "Prefer `media.recognize` with the source path. If recognition is not reliable, use `media.search` with keywords from filename, title, or year."
      - "Only continue when you have high confidence in the target media."
      - "Before re-organizing, call `transfer.history.delete`. Durable records are not deleted: the API submits them to the persistent retry scheduler."
      - "If `transfer.history.delete` reports that a durable retry was accepted or rejected, stop for that record and report the exact scheduler result. Do not call `transfer.file`; do not delete the target, history, or retry evidence. Only a legacy history deletion may be followed by `transfer.file`."
      - "For a legacy history that was actually deleted, use `transfer.file` to organize the source path directly."
      - "When calling `transfer.file`, reuse known context when appropriate: source storage, target path, target storage, transfer mode, season, media_source, media_id, media_type, and music_type. For an album, retry the album directory once with the album identity when the records share that directory."
      - "If this record is already correct and no re-organize is needed, do not perform destructive actions; simply report that no change is necessary."
    task_rules:
      - "Do NOT rely on previous chat context. Work only from the record above."
      - "Your goal is to directly fix one transfer history record by using MoviePilot tools to analyze, clean up the old history entry if necessary, and organize the source file again."
      - "Complete the re-organize with `moviepilot_api` operations `transfer.history`, `media.recognize`, `media.search`, `transfer.history.delete`, and `transfer.file`."
      - "Do NOT reorganize blindly when media identity is uncertain."
      - "If the previous record was successful but obviously identified as the wrong media, still use the tool-based flow above instead of `/redo`."
      - "Keep the final response short and focused on outcome."
  batch_manual_transfer_redo:
    header: "[System Task - Batch Manual Transfer Re-Organize]"
    objective: "A user manually triggered a batch AI re-organize task from the transfer history page."
    context_title: "Selected transfer history records"
    context_lines:
      - "- History IDs: {history_ids_csv}"
      - "- Total records: {history_count}"
      - "{records_context}"
    steps_title: "Required workflow"
    steps:
      - "Review the selected records below first and group them by likely shared media identity, source directory, or retry strategy when possible."
      - "Use the provided record context as the primary source of truth. Call `transfer.history` only when you need extra confirmation."
      - "For each group, decide whether the current recognition is trustworthy."
      - "If multiple records clearly belong to the same movie, series, or music album, identify the media once with `media.recognize` or `media.search`, then reuse that result for the related records. A recording remains a single-track target, and an artist is browse-only."
      - "If a source file no longer exists or cannot be safely processed, skip that record and note the reason."
      - "Before re-organizing each record, call `transfer.history.delete`. Durable records are not deleted: the API submits each task to the persistent retry scheduler."
      - "For each durable result, report the exact accepted or rejected scheduler state and stop processing that record. Do not call `transfer.file`; do not delete its target, history, or retry evidence."
      - "Only after a legacy history was actually deleted, use `transfer.file` to organize that source path directly."
      - "When calling `transfer.file`, reuse known context when appropriate: source storage, target path, target storage, transfer mode, season, media_source, media_id, media_type, and music_type. Prefer one directory transfer for a verified complete album instead of treating each track as an unrelated media item."
      - "If a record is already correct and no re-organize is needed, do not perform destructive actions; simply mark it as skipped."
      - "Report only the aggregate outcome, including how many records succeeded, skipped, and failed."
    task_rules:
      - "Do NOT assume every selected record belongs to the same media."
      - "When several records obviously share the same media identity, avoid repeated `media.recognize` or `media.search` calls."
      - "Process every selected record exactly once."
      - "Keep the final response short and focused on the aggregate outcome."
      - "Final response must be plain text only: one concise Chinese sentence or paragraph describing the aggregate result."
      - "Do NOT include any title/header, bullet list, numbered list, bold text, code block, table, or other Markdown formatting."
  search_recommend:
    header: "[System Task - Search Results Recommendation]"
    objective: "Analyze the provided search results and select the best matching items based on user preferences."
    context_title: "Task context"
    context_lines:
      - "{search_results}"
    steps_title: "Follow these steps"
    steps:
      - "Review all search result items carefully."
      - "Evaluate each item based on the user preference criteria."
      - "Select the top items that best match the preferences."
      - "Return ONLY a JSON array of item indices."
    task_rules:
      - "Return ONLY a JSON array of index numbers, e.g., [0, 3, 1]."
      - "Do NOT include any explanations, markdown formatting, conversational text, or other content."
      - "Do NOT call any tools. Simply analyze and return the JSON result directly."
      - "Respond in JSON format only."
