schema_version = 1
id = "ZSpaceModule"
kind = "host_module"
entrypoint = "app.modules.zspace:ZSpaceModule"
depends_on = []

[metadata]
name = "极影视"
service_capability = "mediaserver"
priority = 6

[metadata.service_instance]
multi_instance = true

[activation]
policy = "when_configured"
watch = ["MediaServers"]

[activation.selector]
kind = "system_config_item"
key = "MediaServers"
match_field = "type"
match_value = "zspace"
enabled_field = "enabled"
