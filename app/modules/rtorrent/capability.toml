schema_version = 1
id = "RtorrentModule"
kind = "host_module"
entrypoint = "app.modules.rtorrent:RtorrentModule"
depends_on = []

[metadata]
name = "Rtorrent"
service_capability = "downloader"
priority = 3

[metadata.service_instance]
multi_instance = true

[activation]
policy = "when_configured"
watch = ["Downloaders"]

[activation.selector]
kind = "system_config_item"
key = "Downloaders"
match_field = "type"
match_value = "rtorrent"
enabled_field = "enabled"
