schema_version = 1
id = "DiscordModule"
kind = "host_module"
entrypoint = "app.modules.discord:DiscordModule"
depends_on = []

[metadata]
name = "Discord"
type = "notification"
subtype = "Discord"
priority = 4

channel_api_version = 1
channel_extension = "app.modules.discord.channel:DiscordPlatform"

channel_interaction = true

[activation]
policy = "when_configured"
watch = ["Notifications", "ChannelSettings", "PROXY_HOST"]

[activation.selector]
kind = "system_config_item"
key = "Notifications"
match_field = "type"
match_value = "discord"
enabled_field = "enabled"
