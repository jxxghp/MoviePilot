schema_version = 1
id = "DingTalkModule"
kind = "host_module"
entrypoint = "app.modules.dingtalk:DingTalkModule"
depends_on = []

[metadata]
name = "DingTalk"
type = "notification"
subtype = "DingTalk"
priority = 11

channel_extension = "app.modules.dingtalk.channel:DingtalkPlatform"

channel_interaction = false

[activation]
policy = "when_configured"
watch = ["Notifications", "ChannelSettings"]

[activation.selector]
kind = "system_config_item"
key = "Notifications"
match_field = "type"
match_value = "dingtalk"
enabled_field = "enabled"
