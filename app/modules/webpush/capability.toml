schema_version = 1
id = "WebPushModule"
kind = "host_module"
entrypoint = "app.modules.webpush:WebPushModule"
depends_on = []

[metadata]
name = "WebPush"
service_capability = "notification"
subtype = "WebPush"
priority = 6

[metadata.service_instance]
multi_instance = true

[activation]
policy = "when_configured"
watch = ["Notifications"]

[activation.selector]
kind = "system_config_item"
key = "Notifications"
match_field = "type"
match_value = "webpush"
enabled_field = "enabled"
