schema_version = 1
id = "QbittorrentModule"
kind = "host_module"
entrypoint = "app.modules.qbittorrent:QbittorrentModule"
depends_on = []

[metadata]
name = "Qbittorrent"
service_capability = "downloader"
priority = 1

[metadata.service_instance]
multi_instance = true

[activation]
policy = "when_configured"
watch = ["Downloaders"]

[activation.selector]
kind = "system_config_item"
key = "Downloaders"
match_field = "type"
match_value = "qbittorrent"
enabled_field = "enabled"
