schema_version = 1
id = "SlackModule"
kind = "host_module"
entrypoint = "app.modules.slack:SlackModule"
depends_on = []

[metadata]
name = "Slack"
type = "notification"
subtype = "Slack"
priority = 3

channel_api_version = 1
channel_extension = "app.modules.slack.channel:SlackPlatform"

channel_interaction = true

[activation]
policy = "when_configured"
watch = ["Notifications", "ChannelSettings"]

[activation.selector]
kind = "system_config_item"
key = "Notifications"
match_field = "type"
match_value = "slack"
enabled_field = "enabled"
