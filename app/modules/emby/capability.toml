schema_version = 1
id = "EmbyModule"
kind = "host_module"
entrypoint = "app.modules.emby:EmbyModule"
depends_on = []

[metadata]
name = "Emby"
service_capability = "mediaserver"
priority = 1

[metadata.service_instance]
multi_instance = true

[activation]
policy = "when_configured"
watch = ["MediaServers"]

[activation.selector]
kind = "system_config_item"
key = "MediaServers"
match_field = "type"
match_value = "emby"
enabled_field = "enabled"
