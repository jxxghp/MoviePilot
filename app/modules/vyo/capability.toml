schema_version = 1
id = "VyoModule"
kind = "host_module"
entrypoint = "app.modules.vyo:VyoModule"
depends_on = []

[metadata]
name = "Vyo"
type = "mediaserver"
subtype = "Vyo"
priority = 7

[activation]
policy = "when_configured"
watch = ["MediaServers"]

[activation.selector]
kind = "system_config_item"
key = "MediaServers"
match_field = "type"
match_value = "mediavault"
enabled_field = "enabled"
