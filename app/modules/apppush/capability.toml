schema_version = 1
id = "AppPushModule"
kind = "host_module"
entrypoint = "app.modules.apppush:AppPushModule"
depends_on = []

[metadata]
name = "AppPush"
type = "notification"
subtype = "AppPush"
priority = 7

[activation]
policy = "when_configured"
watch = ["Notifications"]

[activation.selector]
kind = "system_config_item"
key = "Notifications"
match_field = "type"
match_value = "apppush"
enabled_field = "enabled"
