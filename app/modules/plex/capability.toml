schema_version = 1
id = "PlexModule"
kind = "host_module"
entrypoint = "app.modules.plex:PlexModule"
depends_on = []

[metadata]
name = "Plex"
service_capability = "mediaserver"
priority = 3

[metadata.service_instance]
multi_instance = true

[activation]
policy = "when_configured"
watch = ["MediaServers"]

[activation.selector]
kind = "system_config_item"
key = "MediaServers"
match_field = "type"
match_value = "plex"
enabled_field = "enabled"
