schema_version = 1
id = "TelegramModule"
kind = "host_module"
entrypoint = "app.modules.telegram:TelegramModule"
depends_on = []

[metadata]
name = "Telegram"
type = "notification"
subtype = "Telegram"
priority = 0

channel_api_version = 1
channel_extension = "app.modules.telegram.channel:TelegramPlatform"

channel_interaction = true

[activation]
policy = "when_configured"
watch = ["Notifications", "ChannelSettings", "PROXY_HOST"]

[activation.selector]
kind = "system_config_item"
key = "Notifications"
match_field = "type"
match_value = "telegram"
enabled_field = "enabled"
