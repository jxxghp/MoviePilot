name: Pylint Code Quality Check

on:
  pull_request:
    branches:
      - v3
  push:
    branches:
      - v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pylint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pylint:
    runs-on: ubuntu-latest
    name: Pylint Code Quality Check

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.12.5'
        python-version: '3.12'
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      run: uv sync --locked

    - name: Verify pylint config
      run: |
        # 检查项目中的pylint配置文件是否存在
        if [ -f .pylintrc ]; then
          echo "✅ 找到项目配置文件: .pylintrc"
          echo "配置文件内容预览:"
          head -10 .pylintrc
        else
          echo "❌ 未找到 .pylintrc 配置文件"
          exit 1
        fi
    - name: Run pylint
      run: |
        # 运行pylint，检查主要的Python文件
        echo "🚀 运行 Pylint 错误检查..."

        # 检查主要目录 - 只关注错误，如果有错误则退出
        echo "📂 检查 app/ 目录..."
        uv run --locked --no-sync pylint app/ --output-format=colorized --reports=yes --score=yes

        # 检查根目录的Python文件
        echo "📂 检查根目录 Python 文件..."
        for file in $(find . -name "*.py" -not -path "./.*" -not -path "./.venv/*" -not -path "./build/*" -not -path "./dist/*" -not -path "./tests/*" -not -path "./docs/*" -not -path "./__pycache__/*" -maxdepth 1); do
          echo "检查文件: $file"
          uv run --locked --no-sync pylint "$file" --output-format=colorized || exit 1
        done

        # 生成详细报告
        echo "📊 生成 Pylint 详细报告..."
        uv run --locked --no-sync pylint app/ --output-format=json > pylint-report.json || true

        # 显示评分（仅供参考）
        echo "📈 Pylint 评分（仅供参考）:"
        uv run --locked --no-sync pylint app/ --score=yes --reports=no | tail -2 || true

    - name: Upload pylint report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pylint-report
        path: pylint-report.json

    - name: Summary
      run: |
        echo "🎉 Pylint 检查完成！"
        echo "✅ 没有发现语法错误或严重问题"
        echo "📊 详细报告已保存为构建工件"
