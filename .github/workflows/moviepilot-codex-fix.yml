# Manual fix dispatch. Codex receives write permissions only in the reusable workflow.
name: MoviePilot Codex fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or PR number to investigate.
        required: true
        type: string
      prompt_name:
        description: issue-fix, ci-fix, or delivery.
        required: false
        default: issue-fix
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  codex:
    uses: jxxghp/MoviePilot-Maintenance/.github/workflows/codex-fix.yml@92de2d08cbea2ca60ad14c070294e07b79eaf26c
    with:
      control_repository: jxxghp/MoviePilot-Maintenance
      control_ref: 92de2d08cbea2ca60ad14c070294e07b79eaf26c
      prompt_name: ${{ inputs.prompt_name }}
      codex_model: ${{ vars.CODEX_MODEL }}
      codex_effort: ${{ vars.CODEX_EFFORT || 'high' }}
      openai_base_url: ${{ vars.OPENAI_BASE_URL }}
      publish_comments: true
      autofix_enabled: ${{ vars.CODEX_AUTOFIX_ENABLED == 'true' }}
      telegram_enabled: ${{ vars.TELEGRAM_ENABLED == 'true' }}
      telegram_chat_id: ${{ vars.TELEGRAM_CHAT_ID }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAINTENANCE_TARGET_GH_TOKEN: ${{ secrets.MAINTENANCE_TARGET_GH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
